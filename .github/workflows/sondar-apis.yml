# Testa as APIs a partir do GitHub (o ambiente das sessões na nuvem não acessa esses sites).
# Rodar pela aba Actions → "Sondar APIs" → "Run workflow". Também roda quando o script muda.
name: Sondar APIs

on:
  workflow_dispatch:
    inputs:
      grupo:
        description: "tudo, tcgdex, ptcgapi, limitless, cotacao ou fandom"
        required: false
        default: "tudo"
  push:
    branches: [main]
    paths: [scripts/sondar-apis.mjs]

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sondar-apis.mjs ${{ inputs.grupo || 'fontes2' }}
